[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labsignal"
version = "0.1.0"
description = "Local, LLM-free unsupervised anomaly detection for clinical laboratory data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kapil Sardiwal" }]
dependencies = [
  "numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "scikit-learn>=1.5",
  "umap-learn>=0.5.6", "hdbscan>=0.8.38", "shap>=0.45",
]

[project.optional-dependencies]
app = ["streamlit>=1.35", "plotly>=5.20"]
experiments = ["matplotlib>=3.8", "pyreadstat>=1.2"]

[project.scripts]
labsignal = "labsignal.__main__:main"

[tool.setuptools]
packages = ["labsignal"]
